name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint e regras de camadas (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Testes (Jest)
        run: npm test -- --ci

      - name: Build do pacote JavaScript (Android)
        run: npm run build
